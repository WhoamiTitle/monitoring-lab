apiVersion: 1
providers:
  - name: demo
    orgId: 1
    folder: Monitoring Demo
    type: file
    disableDeletion: false
    # Docker Desktop не всегда передаёт события изменений bind mount.
    # Интервал больше 10 включает периодический опрос файлов.
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /etc/grafana/demo-dashboards
