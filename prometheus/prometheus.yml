global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]

  - job_name: web-metrics
    static_configs:
      - targets: ["web-1:9117"]
        labels:
          service: web-1
      - targets: ["web-2:9117"]
        labels:
          service: web-2

  - job_name: web-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://web-1:80/"]
        labels:
          service: web-1
      - targets: ["http://web-2:80/"]
        labels:
          service: web-2
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
