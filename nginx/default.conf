log_format demo_metrics '$status $request_time $uri';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/demo-access.log;
    access_log /var/log/nginx/monitoring-metrics.log demo_metrics;

    location = /__demo/slow {
        proxy_pass http://127.0.0.1:9117/slow;
    }

    location = /__demo/error {
        default_type text/plain;
        return 500 "Simulated server error\n";
    }

    location / {
        default_type text/plain;
        return 200 "Monitoring demo is running\n";
    }
}
