name: prometheus-learning

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - blackbox

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: learning-demo
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards/availability.json:/etc/grafana/demo-dashboards/availability.json:ro
    depends_on:
      - prometheus

  blackbox:
    image: prom/blackbox-exporter:v0.29.0
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  web-1:
    image: nginx:1.28-alpine
    labels:
      monitoring_demo: web-1
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    cpus: 1.0

  web-2:
    image: nginx:1.28-alpine
    labels:
      monitoring_demo: web-2
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    cpus: 1.0

  load:
    image: busybox:1.37
    profiles:
      - load
    command:
      - sh
      - -c
      - |
        while true; do
          wget -q -T 2 -O /dev/null http://web-1:80/ || true
          wget -q -T 2 -O /dev/null http://web-2:80/ || true
          sleep 0.1
        done
    depends_on:
      - web-1
      - web-2

volumes:
  prometheus-data:
  grafana-data:
